[project]
name        = "pi66.xyz"
version     = "0.2.0"
description = "my main website"

[tree]
markdown  = "md"

static    = "static"
dest      = "/srv/www/pi66.xyz/public/html"

templates = "build/templates"
plugins   = "build/plugins"


[webview]
host  = "localhost"
port = 7999
dev_tools = false
html_path   = "/"
static_path = "/static"

[extras]
highlight = "monokai"

[cache]
hash=".hash.cache"
