[project]
name        = "pi66.xyz"
version     = "0.2.0"
description = "my main website"

[tree]
markdown  = "md"
static    = "src/static"
templates = "src/templates"
plugins   = "src/plugins"

draft_dest   = "draft"
release_dest = "/srv/www/pi66.xyz/public/html"

[webview]
host  = "localhost"
port = 7999
dev_tools = false
html_path   = "/"
static_path = "/static"

[extras]
highlight = "monokai"

[cache]
hash=".hash.cache"

[globals]
key="value"
